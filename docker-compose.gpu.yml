# Overlay for Linux hosts with NVIDIA GPUs. Requires nvidia-container-toolkit.
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
services:
  master-controller-api:
    environment:
      - GPU_ENABLED=true
    # The controller runs no CUDA itself. It sees every GPU so it can meter the one a model
    # container is actually pinned to (compose/base.yml), whatever GPU_ID says. NVML
    # queries create no context and allocate no GPU memory.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]

