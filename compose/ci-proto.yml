services:
  ci-proto:
    extends:
      file: base.yml
      service: gpu-model-base
    image: ci-proto
    build:
      context: ../model-services/ci-proto
      dockerfile: Dockerfile
    profiles: ["ci-proto", "all-models"]
    environment:
      - MODEL_ID=ContinuousIntelligence/ci-proto
      - MODEL_REVISION=ee3031351a151e3f6febf8c62b53e6ea1008bef6
      - HF_HOME=/models/huggingface
      - CROSS_SERIES=false
