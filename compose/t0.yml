services:
  t0-template: &t0-template
    extends:
      file: base.yml
      service: gpu-model-base
    image: t0
    build:
      context: ../model-services/t0
      dockerfile: Dockerfile
    profiles: ["t0", "all-models"]

  t0-alpha:
    <<: *t0-template
    environment:
      - MODEL_ID=theforecastingcompany/t0-alpha
      - HF_HOME=/models/huggingface

  t0-beta:
    <<: *t0-template
    environment:
      - MODEL_ID=theforecastingcompany/t0-beta
      - HF_HOME=/models/huggingface

  # tfc-t0 0.6.0, which gamma needs, changes how alpha and beta treat missing
  # values, so gamma gets its own image.
  t0-gamma:
    <<: *t0-template
    image: t0-gamma
    build:
      context: ../model-services/t0
      dockerfile: Dockerfile
      args:
        REQUIREMENTS: requirements-gamma.txt
    environment:
      - MODEL_ID=theforecastingcompany/t0-gamma
      - MODEL_REVISION=44688addc233021f3872680354f16d9ab7e6b918
      - HF_HOME=/models/huggingface
